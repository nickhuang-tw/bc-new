<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>IVI Slot Dashboard - Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background: #101823;
      color: #eef4f8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(77, 143, 172, .18), transparent 30%),
        linear-gradient(135deg, #0d141e 0%, #172331 100%);
    }

    main {
      width: min(680px, calc(100vw - 40px));
      padding: 36px;
      border: 1px solid rgba(167, 196, 211, .2);
      border-radius: 8px;
      background: rgba(18, 29, 42, .9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .36);
    }

    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #79b8d8;
      color: #0d141e;
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #b9cbd5;
      font-size: 16px;
      line-height: 1.8;
    }

    .note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(167, 196, 211, .18);
      color: #d7e6ee;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">IVI</div>
    <h1>線上儀表板已暫停公開顯示</h1>
    <p>此 GitHub 預覽版本目前已關閉。請改用本地離線版 HTML 檔案開啟儀表板內容。</p>
    <p class="note">Offline dashboard file: IVI_Slot_Dashboard_Local.html</p>
  </main>
</body>
</html>
